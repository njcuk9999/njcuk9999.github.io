# Refreshes data/publications.json (the publications snapshot the site
# reads) and data/repos.json (GitHub numbers for the Software cards) every
# Monday, or on demand from the Actions tab ("Run workflow").
# Optional: add a repository secret ADS_TOKEN (Settings > Secrets and
# variables > Actions) to include ADS reads and bibcodes.
name: Update site data

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch publications
        run: python scripts/update_publications.py
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
      - name: Fetch GitHub numbers for software.txt
        run: python scripts/update_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/repos.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update publications and software snapshots"
          git pull --rebase
          git push
