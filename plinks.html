<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Useful links - Neil James Cook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- stylesheets -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/font_icon/css/pe-icon-7-stroke.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- google fonts -->
    <link href="https://fonts.googleapis.com/css?family=Dosis:300,400,500%7CLato:300,400,700%7CRaleway:100,300"
      rel="stylesheet" type="text/css">
    <style>
      :root {
        --lk-bg: #14161b;
        --lk-card: #1c2028;
        --lk-card-hover: #232833;
        --lk-line: #2b303b;
        --lk-ink: #e9ebef;
        --lk-muted: #98a1b0;
        --lk-accent: #e66f69;
      }
      body { background: var(--lk-bg); color: var(--lk-ink); }
      #navigation { position: sticky; top: 0; z-index: 20; }

      .lk-hero { padding: 56px 0 20px; text-align: center; }
      .lk-hero h1 { font-family: 'Raleway', sans-serif; font-weight: 100; font-size: 3.6em; margin: 0 0 6px; }
      .lk-hero p { color: var(--lk-muted); margin: 0 0 24px; }
      .lk-search { position: relative; max-width: 520px; margin: 0 auto; }
      .lk-search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
                     font-size: 22px; color: var(--lk-muted); pointer-events: none; }
      .lk-search input { width: 100%; padding: 12px 44px 12px 44px; border-radius: 999px;
                         border: 1px solid var(--lk-line); background: var(--lk-card); color: var(--lk-ink);
                         font-size: 16px; outline: none; transition: border-color .2s; }
      .lk-search input:focus { border-color: var(--lk-accent); }
      .lk-search kbd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
                       background: none; border: 1px solid var(--lk-line); color: var(--lk-muted);
                       box-shadow: none; font-size: 12px; padding: 1px 6px; }

      .lk-tabs { position: sticky; top: 0; z-index: 10; background: var(--lk-bg);
                 display: flex; gap: 8px; overflow-x: auto; padding: 14px 0; margin-bottom: 8px;
                 border-bottom: 1px solid var(--lk-line); scrollbar-width: none; }
      .lk-tabs::-webkit-scrollbar { display: none; }
      .lk-tab { flex: none; border: 1px solid var(--lk-line); background: transparent; color: var(--lk-muted);
                border-radius: 999px; padding: 6px 14px; font-family: 'Dosis', sans-serif; font-size: 15px;
                letter-spacing: .02em; transition: all .2s; }
      .lk-tab:hover { color: var(--lk-ink); border-color: var(--lk-muted); }
      .lk-tab.is-active { background: var(--lk-accent); border-color: var(--lk-accent); color: #fff; }
      .lk-tab .lk-count { opacity: .7; margin-left: 4px; font-size: 13px; }
      .lk-tab.is-empty { opacity: .4; }

      .lk-group { margin: 26px 0 8px; }
      .lk-group h2 { font-family: 'Dosis', sans-serif; font-weight: 400; font-size: 1.5em; margin: 0 0 14px;
                     color: var(--lk-ink); display: flex; align-items: baseline; gap: 10px; }
      .lk-group h2 span { color: var(--lk-muted); font-size: .6em; }
      .lk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

      .lk-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 68px;
                 background: var(--lk-card); border: 1px solid var(--lk-line); border-radius: 10px;
                 color: var(--lk-ink); transition: transform .15s, background .15s, border-color .15s; }
      .lk-card:hover, .lk-card:focus { background: var(--lk-card-hover); border-color: var(--lk-accent);
                                       color: var(--lk-ink); transform: translateY(-2px); opacity: 1; }
      .lk-ico { flex: none; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center;
                background: #fff; overflow: hidden; font-family: 'Dosis', sans-serif; font-weight: 500;
                font-size: 20px; color: #fff; }
      .lk-ico img { width: 24px; height: 24px; }
      .lk-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .lk-name { font-size: 15px; line-height: 1.3; }
      .lk-host { font-size: 12px; color: var(--lk-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lk-go { flex: none; font-size: 24px; color: var(--lk-muted); transition: color .15s, transform .15s; }
      .lk-card:hover .lk-go { color: var(--lk-accent); transform: translateX(3px); }

      .lk-empty { text-align: center; color: var(--lk-muted); padding: 60px 0; font-size: 16px; }
      .lk-empty i { display: block; font-size: 48px; margin-bottom: 8px; }
      main.container { padding-bottom: 60px; }
      footer { margin-top: 0; }
      @media (max-width: 480px) {
        .lk-hero { padding-top: 36px; }
        .lk-hero h1 { font-size: 2.6em; }
        .lk-search kbd { display: none; }
        #navigation .logo-text { font-size: 2em; }
      }
    </style>
  </head>
  <body id="body">
    <!-- Navigation area -->
    <section id="navigation">
      <div class="container">
        <div class="row">
          <div class="col-xs-6">
            <div class="logo"><a href="index.html" class="logo-text">Neil James Cook</a></div>
          </div>
          <div class="col-xs-6">
            <div class="nav"> <a href="#" data-placement="bottom" title="Menu"
                class="menu" data-toggle="dropdown"><i class="pe-7s-menu"></i></a>
              <div class="dropdown-menu">
                <div class="arrow-up"></div>
                <ul>
                  <li><a href="index.html">Home <i class="pe-7s-home"></i></a><span
                      class="menu-effect"></span></li>
                  <li><a href="index.html#contact">Contact <i class="pe-7s-mail"></i></a><span
                      class="menu-effect"></span></li>
                  <li><a href="plinks.html">Links <i class="pe-7s-global"></i></a><span
                      class="menu-effect"></span></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Links (loaded from links.txt, edit via admin.html) -->
    <main class="container">
      <div class="lk-hero">
        <h1>Useful links</h1>
        <p id="lk-summary">&nbsp;</p>
        <div class="lk-search">
          <i class="pe-7s-search"></i>
          <input id="lk-q" type="search" placeholder="Search links" aria-label="Search links" autocomplete="off">
          <kbd>/</kbd>
        </div>
      </div>
      <nav id="lk-tabs" class="lk-tabs" aria-label="Link sections"></nav>
      <div id="lk-results"></div>
    </main>

    <!-- Footer Area -->
    <footer>
      <div class="container">
        <div class="row">
          <div class="col-sm-6">
            <p class="copyright">© Copyright 2022 <a href="https://njcuk9999.github.io">https://njcuk9999.github.io</a></p>
          </div>
        </div>
      </div>
    </footer>

    <script src="assets/js/jquery-2.1.3.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/sitedata.js"></script>
    <script>
    (function () {
        var esc = SiteData.esc;
        var sections = [];
        var active = "all";
        var query = "";
        var COLOURS = ["#e66f69", "#4e9ad6", "#5bb381", "#c18be0", "#e0a64e", "#4bb5b0"];

        function slug(s) {
            return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        }

        function host(url) {
            try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
        }

        // letter tile fallback for sites without a favicon
        function tile(name) {
            var h = 0;
            for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
            return '<span class="lk-ico" style="background:' + COLOURS[h % COLOURS.length] + '">' +
                esc((name.match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase()) + "</span>";
        }

        function card(link) {
            var d = host(link.url);
            var icon = d
                ? '<span class="lk-ico"><img loading="lazy" alt="" src="https://www.google.com/s2/favicons?sz=64&domain=' +
                  encodeURIComponent(d) + '" data-name="' + esc(link.name) + '"></span>'
                : tile(link.name);
            return '<a class="lk-card" href="' + esc(SiteData.safeUrl(link.url)) + '" target="_blank" rel="noopener">' +
                icon + '<span class="lk-text"><span class="lk-name">' + esc(link.name) + "</span>" +
                '<span class="lk-host">' + esc(d || link.url) + "</span></span>" +
                '<i class="pe-7s-angle-right lk-go"></i></a>';
        }

        function matches(link) {
            if (!query) return true;
            return (link.name + " " + link.url).toLowerCase().indexOf(query) >= 0;
        }

        function renderTabs() {
            var total = 0;
            var html = sections.map(function (s) {
                var n = s.links.filter(matches).length;
                total += n;
                return '<button class="lk-tab' + (active === s.slug ? " is-active" : "") + (n ? "" : " is-empty") +
                    '" data-tab="' + s.slug + '">' + esc(s.title) + '<span class="lk-count">' + n + "</span></button>";
            }).join("");
            document.getElementById("lk-tabs").innerHTML =
                '<button class="lk-tab' + (active === "all" ? " is-active" : "") + '" data-tab="all">All' +
                '<span class="lk-count">' + total + "</span></button>" + html;
        }

        function renderResults() {
            var shown = sections.filter(function (s) { return active === "all" || s.slug === active; });
            var html = shown.map(function (s) {
                var links = s.links.filter(matches);
                if (!links.length) return "";
                var heading = active === "all"
                    ? "<h2>" + esc(s.title) + "<span>" + links.length + "</span></h2>" : "";
                return '<section class="lk-group">' + heading + '<div class="lk-grid">' +
                    links.map(card).join("") + "</div></section>";
            }).join("");
            document.getElementById("lk-results").innerHTML = html ||
                '<div class="lk-empty"><i class="pe-7s-search"></i>No links match “' + esc(query) + "”" +
                (active !== "all" ? " in this section" : "") + ".</div>";
        }

        function render() {
            renderTabs();
            renderResults();
        }

        function setTab(tab, push) {
            if (tab !== "all" && !sections.some(function (s) { return s.slug === tab; })) tab = "all";
            active = tab;
            if (push) history.replaceState(null, "", tab === "all" ? location.pathname : "#" + tab);
            render();
        }

        document.getElementById("lk-tabs").addEventListener("click", function (e) {
            var btn = e.target.closest("[data-tab]");
            if (btn) setTab(btn.getAttribute("data-tab"), true);
        });

        var q = document.getElementById("lk-q");
        q.addEventListener("input", function () {
            query = q.value.trim().toLowerCase();
            render();
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
            else if (e.key === "Escape" && document.activeElement === q) { q.value = ""; query = ""; render(); }
        });

        window.addEventListener("hashchange", function () {
            setTab(location.hash.slice(1) || "all", false);
        });

        // Google returns a generic globe for unknown sites (16px); swap that for a letter tile
        document.getElementById("lk-results").addEventListener("load", function (e) {
            var img = e.target;
            if (img.tagName === "IMG" && img.naturalWidth && img.naturalWidth <= 16) {
                img.parentNode.outerHTML = tile(img.getAttribute("data-name"));
            }
        }, true);
        document.getElementById("lk-results").addEventListener("error", function (e) {
            var img = e.target;
            if (img.tagName === "IMG") img.parentNode.outerHTML = tile(img.getAttribute("data-name"));
        }, true);

        // keep the tab bar pinned just below the sticky nav
        function pinTabs() {
            document.getElementById("lk-tabs").style.top =
                document.getElementById("navigation").offsetHeight + "px";
        }
        pinTabs();
        window.addEventListener("resize", pinTabs);

        SiteData.load("links.txt").then(function (text) {
            sections = SiteData.parseLinks(text);
            sections.forEach(function (s) { s.slug = slug(s.title); });
            var count = sections.reduce(function (n, s) { return n + s.links.length; }, 0);
            document.getElementById("lk-summary").textContent =
                count + " links across " + sections.length + " collections";
            setTab(location.hash.slice(1) || "all", false);
        }).catch(function (e) {
            console.error(e);
            document.getElementById("lk-results").innerHTML =
                '<div class="lk-empty"><i class="pe-7s-attention"></i>Couldn’t load the links.</div>';
        });
    })();
    </script>
  </body>
</html>
